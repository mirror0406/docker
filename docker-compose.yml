version: "3.9"
services:
    redis:
        image: redis:latest
        container_name: docker-redis
        restart: always
          
    redis-commander:
        image: rediscommander/redis-commander:latest
        container_name: docker-redis-commander
        restart: always
        environment:
            - REDIS_HOSTS=local:redis:6379
        ports:
            - 8081:8081

    nginx:
        build: ./phpdocker/nginx
        image: nginx:latest
        container_name: docker-nginx
        restart: always
        volumes:
            - ./html:/var/www/html
            - ./phpdocker/nginx/conf.d:/etc/nginx/conf.d
        depends_on:
            - php
        ports:
            - 80:80

    php:
        build: ./phpdocker/php
        image: php:7.4-fpm
        container_name: docker-php
        volumes:
            - ./html:/var/www/html
        environment:
            PHP_IDE_CONFIG: "serverName=Docker"
        links:
            - nginx_serv:localhost
        depends_on:
            - mysql

    nginx_serv:
        build: ./phpdocker/nginx
        image: nginx:latest
        container_name: nginx_serv
        restart: always
        volumes:
            - ./check:/var/www/html
            - ./phpdocker/nginx/conf.d_serv:/etc/nginx/conf.d
        depends_on:
            - php_serv
        ports:
            - 8000:80

    php_serv:
        build: ./phpdocker/php
        image: php:7.4-fpm
        container_name: docker-php_serv
        volumes:
            - ./check:/var/www/html
        environment:
            PHP_IDE_CONFIG: "serverName=Docker"
        depends_on:
            - mysql

    mysql:
        image: mysql:latest
        container_name: docker-mysql
        restart: always
        volumes:
            - ./phpdocker/mysql/data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: root

    phpmyadmin:
        image: phpmyadmin/phpmyadmin:latest
        container_name: docker-phpmyadmin
        restart: always
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: root
            PMA_PASSWORD: root
        ports:
            - 8080:80

    mailtrap:
        image: schickling/mailcatcher:latest
        container_name: docker-mailtrap
        ports:
            - 1025:1025
            - 1080:1080