    mysql:
        image: mysql:latest
        container_name: docker-mysql
        restart: always
        volumes:
            - ./phpdocker/mysql/data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: root

    phpmyadmin:
        image: phpmyadmin/phpmyadmin:latest
        container_name: docker-phpmyadmin
        restart: always
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: root
            PMA_PASSWORD: root
        ports:
            - 8080:80

    mailtrap:
        image: schickling/mailcatcher:latest
        container_name: docker-mailtrap
        ports:
            - 1025:1025
            - 1080:1080

    click_client:
        image: yandex/clickhouse-client
        entrypoint:
            - /bin/sleep
        command:
            - infinity

    clickhouse:
        image: yandex/clickhouse-server
        ports:
            - "8123:8123"
        volumes:
            - ./phpdocker/dbfiles:/var/lib/clickhouse

    tabix:
        image: spoonest/clickhouse-tabix-web-client
        ports:
            - "8082:80"
        depends_on:
            - clickhouse

    elasticsearch:
        image: bitnamilegacy/elasticsearch:6.5.4
        container_name: elasticsearch
        ports:
            - "9200:9200"
            - "9300:9300"

    kibana:
        image: bitnamilegacy/kibana:6.5.4
        container_name: kibana
        depends_on: [ "elasticsearch" ]
        environment:
            ELASTICSEARCH_HOSTS: http://elasticsearch:9200
        ports:
            - "5601:5601"