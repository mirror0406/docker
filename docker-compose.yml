version: "3.9"
services:
    redis:
        image: redis:latest
        container_name: docker-redis
        restart: always
          
    redis-commander:
        image: rediscommander/redis-commander:latest
        container_name: docker-redis-commander
        restart: always
        environment:
            - REDIS_HOSTS=local:redis:6379
        ports:
            - 8081:8081

    nginx:
        build: ./phpdocker/nginx
        image: nginx:latest
        container_name: docker-nginx
        restart: always
        volumes:
            - ./html/check:/var/www/html
            - ./phpdocker/nginx/conf.d:/etc/nginx/conf.d
            - ./phpdocker/nginx/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - php
        ports:
            - 80:80

    php:
        build: ./phpdocker/php
        image: php:7.4-fpm
        container_name: docker-php
        volumes:
            - ./html/check:/var/www/html
        environment:
            PHP_IDE_CONFIG: "serverName=Docker"
#        links:
#            - nginx_info:localhost
#            - nginx_resp:localhost
        depends_on:
            - mysql

